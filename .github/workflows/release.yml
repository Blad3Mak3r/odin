name: Release

# Manually triggered: pick a tag (e.g. v0.4.0), and this bumps Cargo.toml's
# version to match, builds the dashboard + release binary, packages .deb and
# .rpm, then publishes a GitHub Release with both attached (plus uploading
# them as workflow artifacts).
#
# Requires Settings -> Actions -> General -> Workflow permissions to be set
# to "Read and write permissions" so the default GITHUB_TOKEN can push the
# version-bump commit/tag to main and create the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.4.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        run: |
          TAG="${{ inputs.tag }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '$TAG'. Expected format vX.Y.Z (e.g. v0.4.0)." >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin." >&2
            exit 1
          fi

      - name: Ensure version increases
        run: |
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"$/\1/')
          HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$VERSION" ] || [ "$VERSION" == "$CURRENT" ]; then
            echo "::error::$VERSION must be strictly greater than current version $CURRENT." >&2
            exit 1
          fi

      - name: Bump Cargo.toml version
        run: |
          sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build frontend
        run: |
          npm --prefix web ci
          VITE_ODIN_VERSION="$VERSION" npm --prefix web run build

      - name: Build release binary
        run: cargo build --release

      - name: Verify Cargo.lock is in sync
        run: grep -A2 '^name = "odin"' Cargo.lock | grep -m1 "version = \"$VERSION\""

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release $TAG"

      - name: Tag release
        run: git tag -a "$TAG" -m "Release $TAG"

      - name: Push commit and tag
        run: git push origin HEAD:main "$TAG"

      - name: Build .deb package
        run: cargo deb --no-build

      - name: Build .rpm package
        run: cargo generate-rpm

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-${{ env.VERSION }}-deb
          path: target/debian/*.deb
          if-no-files-found: error

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-${{ env.VERSION }}-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
