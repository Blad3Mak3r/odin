name: Runtime images

on:
  push:
    branches: [main]
    paths: [containers/**, .github/workflows/runtime-images.yml]
  pull_request:
    paths: [containers/**, .github/workflows/runtime-images.yml]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/blad3mak3r/odin-srv

jobs:
  # Pull requests only prove the images build and start; nothing is pushed.
  # The docker driver lets the Proton build use the base image loaded locally.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Build base image
        run: docker build -f containers/odin-srv/base.Dockerfile -t odin-srv:base .
      - name: Smoke test base image
        run: docker run --rm --entrypoint /bin/sh odin-srv:base -c 'test -x /usr/local/share/odin/steamcmd/steamcmd.sh && test -d /srv/odin/runtime && test -d /srv/odin/instance && test -d /run/odin'
      - name: Build Proton image
        run: docker build -f containers/odin-srv/proton.Dockerfile --build-arg BASE_IMAGE=odin-srv:base -t odin-srv:proton .
      - name: Smoke test Proton image
        run: docker run --rm --entrypoint /bin/sh odin-srv:proton -c 'python3 --version && test -x /usr/local/bin/proton && test -f /usr/local/bin/version && test -x /usr/local/bin/files/bin/wine && test -d /usr/local/bin/files/share/default_pfx'

  base:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=base
            type=raw,value=base-${{ github.sha }}
      - name: Build base image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/odin-srv/base.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=odin-srv-base
          cache-to: type=gha,mode=max,scope=odin-srv-base
      - name: Smoke test base image
        run: docker run --rm --entrypoint /bin/sh "${IMAGE}:base" -c 'test -x /usr/local/share/odin/steamcmd/steamcmd.sh && test -d /srv/odin/runtime && test -d /srv/odin/instance && test -d /run/odin'

  proton:
    if: github.event_name != 'pull_request'
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=proton
            type=raw,value=proton-${{ github.sha }}
      - name: Build Proton image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/odin-srv/proton.Dockerfile
          build-args: BASE_IMAGE=${{ env.IMAGE }}@${{ needs.base.outputs.digest }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=odin-srv-proton
          cache-to: type=gha,mode=max,scope=odin-srv-proton
      - name: Smoke test Proton image
        run: docker run --rm --entrypoint /bin/sh "${IMAGE}:proton" -c 'python3 --version && test -x /usr/local/bin/proton && test -f /usr/local/bin/version && test -x /usr/local/bin/files/bin/wine && test -d /usr/local/bin/files/share/default_pfx'
