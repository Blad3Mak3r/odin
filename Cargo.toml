[package]
name = "odin"
version = "0.8.2"
edition = "2024"
description = "Odin manages the full lifecycle of Valheim dedicated game servers: install, update, mod, and run."
license = "MIT"

[[bin]]
name = "odin"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "webpki-roots"] }
rusty-s3 = "0.10.2"
zip = "8"
flate2 = "1"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
dialoguer = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "process", "fs"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["trace"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
sysinfo = "0.39"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
async-stream = "0.3"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[package.metadata.deb]
name = "odin-server"
maintainer = "Blad3Mak3r <juanluiscarobenito@gmail.com>"
copyright = "2026, Blad3Mak3r"
extended-description = "Runs and maintains Valheim dedicated servers on Linux: installs/updates the server via SteamCMD, runs multiple independent named instances as directly-supervised background processes, manages per-instance config and access lists, takes backups, and installs BepInEx mods from Thunderstore."
conflicts = "odin"
section = "utils"
priority = "optional"
maintainer-scripts = "packaging/deb"
assets = [
    ["target/release/odin", "usr/bin/odin", "755"],
    ["packaging/odin.service", "usr/lib/systemd/system/odin.service", "644"],
    ["packaging/odin.tmpfiles.conf", "usr/lib/tmpfiles.d/odin.conf", "644"],
    ["packaging/config.toml.default", "etc/odin/config.toml", "640"],
    ["README.md", "usr/share/doc/odin/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "odin-server"
assets = [
    { source = "target/release/odin", dest = "/usr/bin/odin", mode = "755" },
    { source = "packaging/odin.service", dest = "/usr/lib/systemd/system/odin.service", mode = "644" },
    { source = "packaging/odin.tmpfiles.conf", dest = "/usr/lib/tmpfiles.d/odin.conf", mode = "644" },
    { source = "packaging/config.toml.default", dest = "/etc/odin/config.toml", mode = "640", config = "noreplace" },
    { source = "README.md", dest = "/usr/share/doc/odin/README.md", mode = "644", doc = true },
]
post_install_script = "packaging/scripts/postinst.sh"
post_uninstall_script = "packaging/scripts/postrm.sh"

[package.metadata.generate-rpm.conflicts]
odin = "*"
