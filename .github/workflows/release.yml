name: Release

# Manually triggered: pick a semantic version increment. The workflow calculates
# the next version from the latest GitHub Release, bumps Cargo.toml to match,
# builds the dashboard + release binary, packages .deb and .rpm, then publishes
# the native artifacts in a GitHub Release and the tested container image to GHCR.
#
# Requires Settings -> Actions -> General -> Workflow permissions to be set
# to "Read and write permissions" so the default GITHUB_TOKEN can push the
# version-bump commit/tag to main and create the release.
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! LATEST_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName'); then
            echo "::error::Could not determine the latest GitHub Release." >&2
            exit 1
          fi
          if ! [[ "$LATEST_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Latest release tag '$LATEST_TAG' is not in vX.Y.Z format." >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          case "${{ inputs.version_bump }}" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            *)
              echo "::error::Unsupported version increment '${{ inputs.version_bump }}'." >&2
              exit 1
              ;;
          esac

          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from $LATEST_TAG (${{ inputs.version_bump }} increment)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin." >&2
            exit 1
          fi

      - name: Ensure version increases
        run: |
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"$/\1/')
          HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$VERSION" ] || [ "$VERSION" == "$CURRENT" ]; then
            echo "::error::$VERSION must be strictly greater than current version $CURRENT." >&2
            exit 1
          fi

      - name: Bump Cargo.toml version
        run: |
          sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f previous_tag_name="$LATEST_TAG" \
            --jq '.body' \
            | sed -E 's/^## /### /; s/^\* /- /' > release-notes.md

      - name: Update changelog
        run: scripts/update-changelog.sh "$VERSION" "$(date -u +%F)" release-notes.md

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build frontend
        run: |
          npm --prefix web ci
          VITE_ODIN_VERSION="$VERSION" npm --prefix web run build

      - name: Build release binary
        run: cargo build --release

      - name: Verify Cargo.lock is in sync
        run: grep -A2 '^name = "odin"' Cargo.lock | grep -m1 "version = \"$VERSION\""

      - name: Stage release binary
        run: |
          install -Dm755 target/release/odin dist/odin-linux-amd64
          cd dist
          sha256sum odin-linux-amd64 > odin-linux-amd64.sha256

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "Release $TAG"

      - name: Tag release
        run: git tag -a "$TAG" -m "Release $TAG"

      - name: Push commit and tag
        run: git push origin HEAD:main "$TAG"

      - name: Build .deb package
        run: cargo deb --no-build

      - name: Build .rpm package
        run: cargo generate-rpm

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-${{ env.VERSION }}-deb
          path: target/debian/*.deb
          if-no-files-found: error

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-${{ env.VERSION }}-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-${{ env.VERSION }}-linux-amd64
          path: |
            dist/odin-linux-amd64
            dist/odin-linux-amd64.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release-notes.md
          files: |
            dist/odin-linux-amd64
            dist/odin-linux-amd64.sha256
            target/debian/*.deb
            target/generate-rpm/*.rpm

  container:
    name: Container
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: odin-${{ needs.release.outputs.version }}-linux-amd64
          path: dist

      - name: Verify Linux binary
        working-directory: dist
        run: sha256sum --check odin-linux-amd64.sha256

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}

      - name: Build image for smoke tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: odin:release-test
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=odin-container
          cache-to: type=gha,mode=max,scope=odin-container

      - name: Smoke test image
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          container=odin-release-test
          volume=odin-release-test-data
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$(docker run --rm odin:release-test --version)" = "odin $VERSION"
          docker volume create "$volume" >/dev/null
          docker run --detach --name "$container" \
            --publish 127.0.0.1:17331:7331 \
            --tmpfs /run/odin:rw,nosuid,nodev,noexec,size=16m,mode=0750,uid=10001,gid=10001 \
            --volume "$volume:/var/lib/odin" \
            odin:release-test serve --bind 0.0.0.0 --port 7331 >/dev/null

          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && {
              docker logs "$container"
              exit 1
            }
            [ "$(docker inspect --format '{{.State.Running}}' "$container")" = true ] || {
              docker logs "$container"
              exit 1
            }
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          curl --fail --silent --show-error http://127.0.0.1:17331/ >/dev/null
          test "$(docker exec "$container" id --user)" = 10001
          docker exec "$container" test -w /var/lib/odin
          docker exec "$container" test -w /run/odin
          docker exec "$container" touch /var/lib/odin/container-volume-probe

          docker stop --time 60 "$container" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
          docker rm "$container" >/dev/null
          docker run --rm --volume "$volume:/var/lib/odin" \
            --entrypoint /usr/bin/test odin:release-test \
            -f /var/lib/odin/container-volume-probe

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=odin-container

      - name: Summarize image
        run: |
          echo "Published $IMAGE_NAME:${{ needs.release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
