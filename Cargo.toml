[package]
name = "odin"
version = "0.2.0"
edition = "2024"
description = "Odin manages the full lifecycle of Valheim dedicated game servers: install, update, mod, and run."
license = "MIT"

[[bin]]
name = "odin"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "webpki-roots"] }
zip = "8"
flate2 = "1"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
dialoguer = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["trace"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
sysinfo = "0.39"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
regex = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
